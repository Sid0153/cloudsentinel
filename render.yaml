# Free public deployment on Render (docs/deployment.md): the real app in sandbox mode, scanning
# a simulated AWS account, with "Explore as guest". Database: a free Neon PostgreSQL project
# (Render's free PostgreSQL is deleted after 30 days).
#
# Service names become the public URLs. If Render reports a name as taken, pick another and
# update the /api/* rewrite below and CORS_ORIGINS to match.
services:
  # Backend + simulator in one container: free plans have no private services, and the
  # simulator (which accepts any credentials) must never get a public address of its own.
  - type: web
    name: cloudsentinel-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeployTrigger: checksPass # deploy only commits that passed CI
    previews:
      generation: off
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # random 256-bit value, generated by Render, never in the repo
      - key: DATABASE_URL
        sync: false # entered once in the Render dashboard (Neon URL, postgresql+psycopg://...)
      - key: CORS_ORIGINS
        value: https://cloudsentinel-demo.onrender.com
      - key: GUEST_EMAIL
        value: guest@cloudsentinel.example
      # Client address for rate limits and the audit log (backend/app/core/client_ip.py):
      # X-Forwarded-For is read from the right, skipping these proxy networks. Render appends
      # to whatever a client sends, and requests through the static site's /api rewrite pass
      # Cloudflare, Render's proxy (74.220.48.0/20, ARIN RS-1125 "Render") and Cloudflare
      # again, so neither the first entry nor True-Client-IP is the visitor. Measured with
      # LOG_FORWARDING_HEADERS; see docs/deployment.md.
      - key: TRUSTED_PROXIES
        value: private, cloudflare, 74.220.48.0/20

  # The React app as a static site (does not sleep). /api/* is proxied to the backend, so the
  # browser talks to one origin and the SameSite=Strict refresh cookie keeps working.
  - type: web
    name: cloudsentinel-demo
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    previews:
      generation: off
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cloudsentinel-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # The same security headers nginx sends in the Docker setup (frontend/nginx.conf).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
