name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that exists only for this job; not a real secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: cloudsentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cloudsentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@localhost:5432/cloudsentinel_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit (pip-audit, runtime and dev lockfiles)
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
      - name: Lint (ruff, including bandit-style security rules)
        run: ruff check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with coverage (fails under 90%)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (npm audit, moderate and above)
        run: npm audit --audit-level=moderate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so a secret removed later is still found
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  docker-stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with generated throwaway values
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build and start the stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Backend liveness (direct)
        run: curl -fsS http://localhost:8000/api/health/live
      - name: Readiness through nginx (proves proxy and database connection)
        run: curl -fsS http://localhost:8080/api/health/ready | grep -q '"database":"up"'
      - name: Frontend serves the app
        run: curl -fsS http://localhost:8080/ | grep -q "CloudSentinel"
      - name: Startup configuration check passed
        run: docker compose logs backend | grep -q "Configuration OK"
      - name: Containers run hardened (non-root, read-only, no capabilities)
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
          ! docker compose exec -T backend touch /app/probe
          docker compose exec -T backend grep -q "CapEff:.0000000000000000" /proc/self/status
      - name: Security headers are served
        run: |
          headers="$(curl -fsSI http://localhost:8080/)"
          echo "$headers" | grep -qi "content-security-policy"
          echo "$headers" | grep -qi "x-frame-options: DENY"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
