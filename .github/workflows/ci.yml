name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that exists only for this job; not a real secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: cloudsentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cloudsentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@localhost:5432/cloudsentinel_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit (pip-audit, runtime, dev and sandbox lockfiles)
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r ../sandbox/requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Lint (ruff, including bandit-style security rules)
        run: ruff check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with coverage (fails under 90%)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (npm audit, moderate and above)
        run: npm audit --audit-level=moderate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so a secret removed later is still found
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  docker-stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with generated throwaway values
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build and start the stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Backend liveness (direct)
        run: curl -fsS http://localhost:8000/api/health/live
      - name: Readiness through nginx (proves proxy and database connection)
        run: curl -fsS http://localhost:8080/api/health/ready | grep -q '"database":"up"'
      - name: Frontend serves the app
        run: curl -fsS http://localhost:8080/ | grep -q "CloudSentinel"
      - name: Startup configuration check passed
        run: docker compose logs backend | grep -q "Configuration OK"
      - name: Containers run hardened (non-root, read-only, no capabilities)
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
          ! docker compose exec -T backend touch /app/probe
          docker compose exec -T backend grep -q "CapEff:.0000000000000000" /proc/self/status
      - name: A forged X-Forwarded-For does not escape the login rate limit (through nginx)
        run: |
          for i in $(seq 1 11); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' -H "X-Forwarded-For: 203.0.113.$i" \
              -d '{"email":"nobody@example.com","password":"wrong-password-123"}')"
          done
          echo "11th attempt: $code"
          test "$code" = "429"
      - name: Security headers are served
        run: |
          headers="$(curl -fsSI http://localhost:8080/)"
          echo "$headers" | grep -qi "content-security-policy"
          echo "$headers" | grep -qi "x-frame-options: DENY"
      - name: Restart in sandbox mode (simulated AWS, guest access)
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml
          up -d --build --wait --wait-timeout 240
      - name: Sandbox end to end (guest sign-in, scans, switches, findings open and close)
        run: python3 scripts/sandbox_smoke.py http://localhost:8080
      - name: Simulator runs hardened and is not published on the host
        run: |
          test "$(docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T sandbox-aws id -u)" != "0"
          ! docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T sandbox-aws touch /app/probe
          simulator="$(docker compose -f docker-compose.yml -f docker-compose.sandbox.yml ps -q sandbox-aws)"
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$simulator")" = "{}"
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml down -v

  deploy-image:
    name: Deployment image (free-plan limits, production settings)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that exists only for this job; not a real secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: cloudsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cloudsentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build deploy/Dockerfile (what Render builds)
        run: docker build -f deploy/Dockerfile -t cloudsentinel-demo .
      - name: Start it like Render's free plan (512 MB, 0.1 CPU, $PORT, production)
        run: |
          docker run -d --name demo --memory 512m --cpus 0.1 -p 127.0.0.1:10000:10000 \
            --add-host host.docker.internal:host-gateway \
            -e PORT=10000 -e APP_ENV=production -e CORS_ORIGINS=https://demo.example \
            -e GUEST_EMAIL=guest@cloudsentinel.example -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgresql+psycopg://ci:ci-only-throwaway@host.docker.internal:5432/cloudsentinel \
            cloudsentinel-demo
          for attempt in $(seq 1 100); do
            curl -fs http://127.0.0.1:10000/api/health/ready && exit 0
            sleep 3
          done
          exit 1
      - name: Sandbox end to end against the deployment image
        run: python3 scripts/sandbox_smoke.py http://127.0.0.1:10000
      - name: Memory stays well under 512 MB, simulator listens on localhost only
        run: |
          used="$(docker stats --no-stream --format '{{.MemUsage}}' demo | cut -d' ' -f1)"
          echo "memory in use: $used"
          python3 -c "import sys; v='$used'; mib=float(v[:-3]) * (1024 if v.endswith('GiB') else 1); sys.exit(mib > 450)"
          # Listening sockets (state 0A) in /proc/net/tcp: the app on 0.0.0.0:10000 (00000000:2710)
          # and the simulator on 127.0.0.1:5000 (0100007F:1388), nothing else.
          listening="$(docker exec demo awk '$4 == "0A" {print $2}' /proc/net/tcp | sort | tr '\n' ' ')"
          echo "listening: $listening"
          test "$listening" = "00000000:2710 0100007F:1388 "
      - name: Show container logs on failure
        if: failure()
        run: docker logs demo
