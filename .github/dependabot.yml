# Weekly pull requests for outdated or vulnerable dependencies. CI (including pip-audit and
# npm audit) runs on each of them, so an update is only merged when everything still passes.
#
# Minor and patch updates are grouped into one PR per ecosystem. Major updates arrive one per
# PR, because they need a deliberate upgrade (and, for the frontend, a visual check: tests do
# not verify styling). Python and Node base images stay on the versions the project targets
# (Python 3.12, Node 22 LTS) until an upgrade is planned.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
