# Secret scanning (run in CI). Uses gitleaks' default rules; the allowlist names only the fake
# AWS key IDs that the redaction tests use on purpose, so a real key anywhere is still caught.
[extend]
useDefault = true

[allowlist]
description = "Fake credentials used by tests"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',  # AWS's own documentation example key ID
  '''AKIAABCDEFGHIJKLMNOP''',
  # A fake SECRET_KEY that a test used in commit 17aea5f (tests now generate keys at runtime).
  # History cannot be rewritten on main, so the exact value is allowed; nothing else is.
  '''test-key-0123456789-abcdefghijklmnopq''',
]
